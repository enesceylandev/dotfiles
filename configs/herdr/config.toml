# herdr configuration — ~/.tmux.conf keybind'lerine göre uyarlanmış
#
# Hiyerarşi eşlemesi:
#   tmux session  -> herdr workspace
#   tmux window   -> herdr tab
#   tmux pane     -> herdr pane
#
# Sözdizimi: "prefix+n" = prefix moduna girip n; "ctrl+n" = doğrudan kısayol.
# Aktif tüm binding'leri canlı görmek için: prefix+?

[keys]
# ---- PREFIX (tmux: set -g prefix C-Space) ----
prefix = "ctrl+space"

# ---- PANE NAVIGATION (tmux: bind -n C-h/j/k/l) ----
# Doğrudan ctrl+hjkl + prefix'li yedek. Yedek önemli: herdr'da tmux'un
# if-shell "$is_vim" passthrough'u yok, nvim içindeyken ctrl+hjkl herdr'a gider.
focus_pane_left  = ["ctrl+h", "prefix+h"]
focus_pane_down  = ["ctrl+j", "prefix+j"]
focus_pane_up    = ["ctrl+k", "prefix+k"]
focus_pane_right = ["ctrl+l", "prefix+l"]

# ---- PANE RESIZE (tmux: bind -r h/j/k/l resize-pane) ----
# herdr'da yön başına resize action'ı yok; resize modu var: prefix+r sonra hjkl.
resize_mode = "prefix+r"

# ---- SPLIT (tmux: bind -n C-s split -v / C-v split -h) ----
split_horizontal = ["ctrl+s", "prefix+minus"]   # alta böler  (tmux -v)
split_vertical   = ["ctrl+v", "prefix+v"]       # sağa böler  (tmux -h)

# ctrl+v'yi split'e verdiğimiz için `herdr --remote`'un raw-key görsel
# yapıştırmasını kapatıyoruz; çakışmasın.
remote_image_paste = ""

# ---- KILL PANE (tmux: bind -n C-w kill-pane; prefix+x tmux'ta unbind edildi) ----
# prefix+x herdr'da da kaldırıldı: tmux ile tutarlı, yanlışlıkla pane/space
# kapanmasın. Pane kapatma yalnızca ctrl+w ile.
close_pane = ["ctrl+w"]

# ---- NEW TAB (tmux: bind -n C-t new-window) ----
new_tab = ["ctrl+t", "prefix+c"]

# ---- ZOOM (tmux: bind -n C-f resize-pane -Z) ----
zoom = ["ctrl+f", "prefix+z"]

# ---- TAB SWITCH (tmux: bind -n M-1..9) ----
# alt+1..9: option+<rakam> ESC+rakam üretir, her terminal kodlamasında
# tek anlamlı. ctrl+1..9 BİLEREK yok: legacy kodlamada ctrl+2 = NUL, yani
# prefix (ctrl+space) ile aynı bayt; ctrl+3 = ESC, ctrl+8 = DEL. Yedek
# olarak bile tutmaya değmez, prefix'i gölgeleme riski var.
switch_tab = ["alt+1..9", "prefix+1..9"]
previous_tab = "prefix+p"
next_tab     = "prefix+n"

# ---- SPACE (workspace) — varsayılanda prev/next/indexed BOŞ geliyor ----
# Şema: ctrl+<key> = pane/tab (sık), prefix+ctrl+<key> = space (seyrek).
# Alt tab geçişi (alt+1..9) ve space rename (alt+r) için kullanılıyor.
# shift+rakam yok — Türkçe klavyede rakam üstleri sembole düşüyor, karışmasın.
switch_workspace   = "prefix+ctrl+1..9"
previous_workspace = "prefix+ctrl+h"
next_workspace     = "prefix+ctrl+l"
# ctrl+t / ctrl+w'nin space seviyesindeki karşılıkları. herdr'da bölgeye göre
# değişen keymap yok (spaces paneli focuslu iken ctrl+t'yi farklı davrandırmak
# mümkün değil), o yüzden aynı harfler bir modifier yukarıda:
#   ctrl+t = yeni tab        prefix+ctrl+t = yeni space
#   ctrl+w = pane kapat      prefix+ctrl+w = space kapat
new_workspace   = ["prefix+ctrl+t", "prefix+shift+n"]
close_workspace = ["prefix+ctrl+w", "prefix+shift+d"]
# Space listesi tek chord'da: prefix ctrl+space olduğu için ctrl+shift+space.
workspace_picker   = ["ctrl+shift+space", "prefix+w"]
# Aktif space'i anında yeniden adlandır.
# Navigator içinde scope'lu "r" herdr'da YOK: navigate mode yalnızca altı
# hareket action'ı kabul ediyor (navigate_workspace_up/down, navigate_pane_*),
# rename diye bir navigate action'ı tanımlı değil. Çıplak "r" de global
# bağlanamaz, her pane'de yazılan r'yi yutar. En yakını option+r:
# alt+r = ESC r, her terminal kodlamasında tek anlamlı, tek modifier.
rename_workspace   = ["alt+r", "ctrl+shift+r", "prefix+shift+w"]

# ---- tmux refleksleri ----
# detach SADECE prefix+q. prefix+d bilerek bağlı değil: tmux'ta detach demek
# zararsızken herdr'da yanlışlıkla oturumdan düşmek can sıkıcı.
detach     = "prefix+q"
rename_tab = ["prefix+shift+t", "prefix+comma"]        # tmux: prefix+,
close_tab  = ["prefix+shift+x", "prefix+ampersand"]    # tmux: prefix+&
last_pane  = "prefix+semicolon"                        # tmux: prefix+;

# edit_scrollback varsayılanı prefix+e; worktree swap'a verebilmek için boşaltıyoruz.
edit_scrollback = ""

# copy_mode varsayılanı zaten prefix+[ — tmux ile aynı, dokunmuyoruz.
# Seçim/kopyalama herdr'ın kendi copy-mode'u ile yapılır (tmux'taki
# vi-mode v/y binding'lerinin karşılığı yok, gerek de yok).

# ---- WORKTREE SWAP (Prefix + e) ----
# Bir worktree workspace'inde pane focuslayıp prefix+e'ye basınca:
# o worktree'nin branch'ini main repo'ya promote eder (inspect için),
# mevcut main branch'ini <repo>-<branch> sibling worktree'ye taşır.
# WIP (worktree + main) stash'lenip doğru yere geri yüklenir.
# Detay: worktree-swap.sh --help
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "$HOME/Documents/dotfiles/configs/herdr/scripts/worktree-swap.sh"

[ui]
# tmux: set -g mouse on
mouse_capture = true
# tmux: set -g set-clipboard on — sürükleyerek seçince otomatik kopyala
copy_on_select = true
# tmux new-window isim sormaz; aynı davranış için:
prompt_new_tab_name = false
agent_panel_sort = "priority"

[ui.sound]
enabled = true
