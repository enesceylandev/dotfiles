# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

font_family      Iosevka Term
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 18.0

cursor_trail_decay 0.1 0.4
cursor_trail 1
cursor_shape block

cursor_blink_interval 0

draw_minimal_borders yes
window_margin_width 5
window_padding_width 3

background_opacity 1

editor /usr/bin/micro

# Color theme
include colors.conf

# Font rendering
font_smooth_body 0
box_drawing_scale 0.001, 1, 1.5, 2
confirm_os_window_close 0

macos_option_as_alt left

# herdr tek bir kitty penceresini yönetiyor; kitty'nin kendi split'i
# ikinci bir herdr client'ı doğurup "already running"e düşer.
# map cmd+shift+enter new_window
map cmd+shift+right next_window
map cmd+shift+left  previous_window

# ---- herdr integration ----
# Karşılıklar ~/.config/herdr/config.toml'dan:
#   tab switch = alt+1..9   new_tab = ctrl+t
#   close_pane = ctrl+w     zoom    = ctrl+f
# macos_option_as_alt left sayesinde sol option = Alt, yani option+2
# doğrudan alt+2 (ESC 2) üretir ve herdr yakalar. Sağ option Türkçe
# layout karakterleri için serbest kalır.
map shift+enter send_text all \x1b[13;2u
map shift+backspace send_text all \x1b[127;2u

# cmd+1..9 -> alt+1..9 ile aynı bayt (ESC + rakam), option+rakam ile eşdeğer
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9

# cmd+t -> ctrl+t (herdr new_tab). Eskiden \x1bt (alt+t) gönderiyordu,
# herdr'da alt+t bağlı olmadığı için ölüydü.
map cmd+t send_text all \x14

# cmd+w -> ctrl+w (herdr close_pane). Eskiden \x1bw idi, o da ölüydü.
map cmd+w send_text all \x17

# cmd+f -> ctrl+f (herdr zoom)
map cmd+f send_text all \x06

# Kaldırıldı: cmd+oklar -> \x1b[1;3X (alt+ok) — herdr'da alt+ok bağlı değil.
# Kaldırıldı: ctrl+tab -> \x1b[18~ (F7) ve ctrl+shift+tab -> \x1b[19~ (F8).
#   Bu ikisi ctrl+tab'ı F7'ye çeviriyordu; herdr F7'yi bilmiyor, üstelik
#   ctrl+tab'ın herdr'a ulaşmasını da engelliyordu. Pane döngüsü prefix+tab.
